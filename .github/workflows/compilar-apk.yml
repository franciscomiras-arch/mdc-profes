name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      MDC_STORE_PASSWORD: ${{ secrets.MDC_STORE_PASSWORD }}
      MDC_KEY_ALIAS: ${{ secrets.MDC_KEY_ALIAS }}
      MDC_KEY_PASSWORD: ${{ secrets.MDC_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Preparar resultado
        if: always()
        run: |
          mkdir -p salida
          cp build.log salida/ 2>/dev/null || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk salida/MdCProfes.apk
            if [ -f app/release.jks ]; then echo "Firmado con la clave del centro" > salida/FIRMA.txt; else echo "Firmado con clave temporal de depuracion" > salida/FIRMA.txt; fi
            echo "OK" > salida/ESTADO.txt
          else
            echo "ERROR" > salida/ESTADO.txt
          fi
          echo "${{ github.sha }}" > salida/COMMIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MdCProfes-APK
          path: salida/

      - name: Publicar en la rama apk
        if: always()
        run: |
          cd salida
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Compilacion ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
