plugins { id 'com.android.application' }

// Firma de publicación: si existe app/release.jks se usa con las variables de entorno
// MDC_STORE_PASSWORD, MDC_KEY_ALIAS y MDC_KEY_PASSWORD. Si no existe, se firma con la clave de depuración.
def releaseKeystore = file('release.jks')

android {
  namespace 'es.iesmdc.profes'
  compileSdk 36

  defaultConfig {
    applicationId 'es.iesmdc.profes'
    minSdk 26
    targetSdk 36
    versionCode 2
    versionName '0.2'
  }

  signingConfigs {
    release {
      if (releaseKeystore.exists()) {
        storeFile releaseKeystore
        storePassword System.getenv('MDC_STORE_PASSWORD') ?: ''
        keyAlias System.getenv('MDC_KEY_ALIAS') ?: 'mdc'
        keyPassword System.getenv('MDC_KEY_PASSWORD') ?: (System.getenv('MDC_STORE_PASSWORD') ?: '')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
      signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.activity:activity:1.9.3'       // selector de fotos y resultados de actividad
  implementation 'androidx.browser:browser:1.8.0'         // Custom Tabs
  implementation 'androidx.core:core:1.13.1'              // FileProvider, insets
  implementation 'androidx.exifinterface:exifinterface:1.3.7' // orientación de las fotos
}
